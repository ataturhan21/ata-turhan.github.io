<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0e15" />
    <link rel="icon" href="/favicon.ico" />
    <title>Page not found | Ata Turhan</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(50rem 26rem at 80% -10%, rgba(200, 169, 107, 0.16), transparent 60%),
          #0a0e15;
        color: #eef1f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main { padding: 2rem 1rem; }
      .eyebrow { color: #c8a96b; font-size: 0.875rem; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
      h1 { margin: 0.75rem 0 0.5rem; font-size: clamp(2rem, 1.4rem + 3vw, 3.25rem); letter-spacing: -0.03em; line-height: 1.1; }
      p { color: #a7b1c2; margin: 0; }
      .home {
        display: inline-flex;
        align-items: center;
        margin: 2rem 0 1.5rem;
        min-height: 2.875rem;
        padding: 0 1.5rem;
        border-radius: 999px;
        background: #c8a96b;
        color: #0a0e15;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { background: #ddc28c; }
      nav a { margin: 0 0.75rem; color: #a7b1c2; font-size: 0.875rem; text-decoration: none; }
      nav a:hover { color: #eef1f6; }
      a:focus-visible { outline: 2px solid #e9cf98; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>This address isn't part of Ata Turhan's portfolio.</p>
      <a class="home" href="/">Go to the portfolio</a>
      <nav aria-label="Sections">
        <a href="/#about">About</a>
        <a href="/#projects">Projects</a>
        <a href="/#skills">Skills</a>
      </nav>
    </main>
  </body>
</html>
