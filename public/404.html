<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e0c0a" />
    <link rel="icon" href="/favicon.ico" />
    <title>Page not found | Ata Turhan</title>
    <style>
      /* The site's own fonts and type styles (src/index.css, .eyebrow and .section-title in App.css). */
      @font-face {
        font-family: "Manrope";
        font-style: normal;
        font-weight: 200 800;
        font-display: swap;
        src: url("/fonts/manrope-variable.woff2") format("woff2");
      }
      @font-face {
        font-family: "Cormorant Garamond";
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url("/fonts/cormorant-garamond-medium.woff2") format("woff2");
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(50rem 26rem at 80% -10%, rgba(233, 181, 106, 0.16), transparent 60%),
          #0e0c0a;
        color: #f6f2ea;
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        text-align: center;
      }
      main { padding: 2rem 1rem; }
      .eyebrow { color: #e9b56a; font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; margin: 0; }
      h1 { margin: 0.75rem 0 0.5rem; font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; font-size: clamp(2rem, 1.4rem + 3vw, 3.25rem); font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; }
      p { color: #b4ab9f; margin: 0; }
      .home {
        display: inline-flex;
        align-items: center;
        margin: 2rem 0 1.5rem;
        min-height: 2.875rem;
        padding: 0 1.5rem;
        border-radius: 999px;
        background: #e9b56a;
        color: #0e0c0a;
        font-weight: 600;
        text-decoration: none;
      }
      .home:hover { background: #f2c98a; }
      nav a { margin: 0 0.75rem; color: #b4ab9f; font-size: 0.875rem; text-decoration: none; }
      nav a:hover { color: #f6f2ea; }
      a:focus-visible { outline: 2px solid #f5d9a8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>This address isn't part of Ata Turhan's portfolio.</p>
      <a class="home" href="/">Go to the portfolio</a>
      <nav aria-label="Sections">
        <a href="/#about">About</a>
        <a href="/#projects">Projects</a>
        <a href="/#skills">Skills</a>
        <a href="/#contact">Contact</a>
      </nav>
    </main>
  </body>
</html>
